<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaskApp Seguro com Supabase</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome para ícones -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- SDK oficial do Supabase via CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col relative overflow-x-hidden">

    <!-- Efeito de Luz / Glow de Fundo Sofisticado -->
    <div class="absolute top-0 left-1/2 -translate-x-1/2 w-[800px] h-[350px] bg-violet-600/10 blur-[120px] rounded-full pointer-events-none -z-10"></div>

    <!-- TELA DE AUTENTICAÇÃO (LOGIN / CADASTRO) -->
    <div id="auth-screen" class="flex-grow flex items-center justify-center p-6 relative">
        <div class="bg-slate-900/90 border border-slate-800/80 rounded-3xl p-10 max-w-xl w-full shadow-2xl backdrop-blur-xl relative overflow-hidden">
            <div class="absolute top-0 right-0 w-32 h-32 bg-violet-500/5 rounded-full blur-2xl pointer-events-none"></div>
            
            <div class="text-center mb-8">
                <div class="w-16 h-16 bg-violet-600/20 text-violet-400 border border-violet-500/30 rounded-2xl flex items-center justify-center mx-auto text-2xl mb-4 shadow-inner">
                    <i class="fa-solid fa-lock"></i>
                </div>
                <h1 class="text-3xl font-extrabold tracking-tight text-slate-100">TaskApp Seguro</h1>
                <p id="auth-subtitle" class="text-slate-400 text-sm mt-2 font-medium">Entre com sua conta para acessar suas tarefas</p>
            </div>

            <form id="auth-form" class="space-y-5">
                <div>
                    <label class="block text-sm font-semibold text-slate-300 mb-2">E-mail</label>
                    <input type="email" id="auth-email" placeholder="seu@email.com" required
                        class="w-full bg-slate-950/80 border border-slate-800 rounded-xl px-5 py-4 text-base text-slate-100 placeholder-slate-600 focus:outline-none focus:border-violet-500 focus:ring-2 focus:ring-violet-500/20 transition-all shadow-inner">
                </div>
                <div>
                    <label class="block text-sm font-semibold text-slate-300 mb-2">Senha</label>
                    <input type="password" id="auth-password" placeholder="••••••••" required
                        class="w-full bg-slate-950/80 border border-slate-800 rounded-xl px-5 py-4 text-base text-slate-100 placeholder-slate-600 focus:outline-none focus:border-violet-500 focus:ring-2 focus:ring-violet-500/20 transition-all shadow-inner">
                </div>

                <div id="auth-error" class="hidden text-red-400 text-sm bg-red-500/10 border border-red-500/20 p-3.5 rounded-xl"></div>

                <button type="submit" id="auth-btn" class="w-full bg-gradient-to-r from-violet-600 to-indigo-600 hover:from-violet-500 hover:to-indigo-500 text-white font-semibold py-4 rounded-xl text-base shadow-lg shadow-violet-500/25 transition-all transform hover:-translate-y-0.5">
                    Entrar
                </button>
            </form>

            <div class="text-center mt-8">
                <button type="button" onclick="toggleAuthMode()" id="auth-toggle-btn" class="text-sm font-medium text-violet-400 hover:text-violet-300 transition-colors">
                    Não tem uma conta? Crie uma agora
                </button>
            </div>
        </div>
    </div>

    <!-- TELA PRINCIPAL DO APP (OCULTA ATÉ O LOGIN) -->
    <div id="app-screen" class="hidden flex-col min-h-screen">
        <!-- HERO INTERATIVA -->
        <header class="relative overflow-hidden bg-gradient-to-r from-violet-950 via-indigo-950 to-slate-950 border-b border-slate-800/80 py-16 px-6">
            <div class="absolute inset-0 opacity-15 bg-[radial-gradient(#8b5cf6_1px,transparent_1px)] [background-size:20px_20px]"></div>
            <div class="max-w-4xl mx-auto relative z-10 flex flex-col sm:flex-row items-center justify-between gap-6">
                <div>
                    <span class="bg-violet-500/10 text-violet-400 text-xs font-semibold px-3.5 py-1.5 rounded-full uppercase tracking-wider border border-violet-500/20 shadow-sm inline-flex items-center gap-1.5">
                        <i class="fa-solid fa-cloud"></i> Nuvem Supabase
                    </span>
                    <h1 class="text-4xl font-black mt-4 tracking-tight text-white">Minhas Tarefas</h1>
                    <p id="user-email-display" class="text-slate-300 text-sm mt-1.5 font-medium"></p>
                </div>
                <button onclick="logout()" class="bg-slate-900/90 border border-slate-800 hover:border-red-500/40 text-slate-300 hover:text-red-400 px-5 py-3 rounded-xl text-sm font-semibold transition-all flex items-center gap-2.5 shadow-md hover:bg-slate-800/80">
                    <i class="fa-solid fa-right-from-bracket"></i> Sair da Conta
                </button>
            </div>

            <!-- Cards de Estatísticas com Glow -->
            <div class="max-w-4xl mx-auto grid grid-cols-3 gap-5 mt-10">
                <div class="bg-slate-900/80 border border-slate-800/80 rounded-2xl p-5 backdrop-blur-md shadow-xl relative overflow-hidden group hover:border-slate-700 transition-all">
                    <p class="text-xs font-semibold text-slate-400 uppercase tracking-wider">Total</p>
                    <p id="stat-total" class="text-3xl font-extrabold text-slate-100 mt-1">0</p>
                </div>
                <div class="bg-slate-900/80 border border-slate-800/80 rounded-2xl p-5 backdrop-blur-md shadow-xl relative overflow-hidden group hover:border-amber-500/30 transition-all">
                    <p class="text-xs font-semibold text-amber-400/90 uppercase tracking-wider">Pendentes</p>
                    <p id="stat-pending" class="text-3xl font-extrabold text-amber-400 mt-1">0</p>
                </div>
                <div class="bg-slate-900/80 border border-slate-800/80 rounded-2xl p-5 backdrop-blur-md shadow-xl relative overflow-hidden group hover:border-emerald-500/30 transition-all">
                    <p class="text-xs font-semibold text-emerald-400/90 uppercase tracking-wider">Concluídas</p>
                    <p id="stat-completed" class="text-3xl font-extrabold text-emerald-400 mt-1">0</p>
                </div>
            </div>
        </header>

        <!-- CONTEÚDO CRUD -->
        <main class="max-w-4xl w-full mx-auto px-6 py-10 flex-grow">
            <!-- Formulário -->
            <div class="bg-slate-900/90 border border-slate-800/80 rounded-3xl p-8 shadow-2xl backdrop-blur-xl mb-10 relative">
                <form id="task-form" class="space-y-6">
                    <input type="hidden" id="task-id">
                    <div>
                        <label class="block text-sm font-semibold text-slate-300 mb-2">O que você precisa fazer?</label>
                        <input type="text" id="task-input" placeholder="Ex: Estudar Supabase..." required
                            class="w-full bg-slate-950/90 border border-slate-800 rounded-xl px-5 py-4 text-base text-slate-100 placeholder-slate-600 focus:outline-none focus:border-violet-500 focus:ring-2 focus:ring-violet-500/20 transition-all shadow-inner">
                    </div>
                    
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-6">
                        <div>
                            <label class="block text-sm font-semibold text-slate-300 mb-2">Categoria:</label>
                            <input type="text" id="task-category" list="category-suggestions" placeholder="Ex: Trabalho, Estudos..." required
                                class="w-full bg-slate-950/90 border border-slate-800 rounded-xl px-4 py-3 text-sm text-slate-200 placeholder-slate-600 focus:outline-none focus:border-violet-500 transition-all shadow-inner">
                            <datalist id="category-suggestions"></datalist>
                        </div>
                        <div>
                            <label class="block text-sm font-semibold text-slate-300 mb-2">Prioridade:</label>
                            <select id="task-priority" class="w-full bg-slate-950/90 border border-slate-800 rounded-xl px-4 py-3 text-sm text-slate-200 focus:outline-none focus:border-violet-500 transition-all shadow-inner">
                                <option value="baixa">Baixa</option>
                                <option value="media" selected>Média</option>
                                <option value="alta">Alta</option>
                            </select>
                        </div>
                    </div>

                    <div class="flex items-center justify-end gap-3 pt-2">
                        <button type="button" id="cancel-edit" class="hidden px-6 py-3 rounded-xl text-sm font-semibold bg-slate-800 text-slate-300 hover:bg-slate-700 transition-colors">
                            Cancelar
                        </button>
                        <button type="submit" id="submit-btn" class="w-full sm:w-auto bg-gradient-to-r from-violet-600 to-indigo-600 hover:from-violet-500 hover:to-indigo-500 text-white font-semibold px-8 py-3.5 rounded-xl text-sm shadow-lg shadow-violet-500/25 transition-all flex items-center justify-center gap-2 transform hover:-translate-y-0.5">
                            <i class="fa-solid fa-plus"></i> Adicionar Tarefa
                        </button>
                    </div>
                </form>
            </div>

            <!-- Filtros -->
            <div class="flex flex-col gap-4 mb-8">
                <div class="flex items-center justify-between flex-wrap gap-4">
                    <div class="flex items-center gap-2 bg-slate-900/90 border border-slate-800/80 p-1.5 rounded-2xl shadow-md">
                        <button onclick="setStatusFilter('all')" id="filter-all" class="px-5 py-2.5 rounded-xl text-xs font-bold bg-violet-600 text-white transition-all shadow">Todas</button>
                        <button onclick="setStatusFilter('pending')" id="filter-pending" class="px-5 py-2.5 rounded-xl text-xs font-semibold text-slate-400 hover:text-slate-200 transition-all">Pendentes</button>
                        <button onclick="setStatusFilter('completed')" id="filter-completed" class="px-5 py-2.5 rounded-xl text-xs font-semibold text-slate-400 hover:text-slate-200 transition-all">Concluídas</button>
                    </div>
                    <button onclick="clearAllCompleted()" class="text-xs font-semibold text-red-400 hover:text-red-300 transition-colors flex items-center gap-2 px-4 py-2.5 bg-red-500/5 hover:bg-red-500/10 border border-red-500/20 rounded-xl">
                        <i class="fa-regular fa-trash-can"></i> Limpar Concluídas
                    </button>
                </div>
                <!-- Filtros de Categorias Dinâmicas -->
                <div id="category-filters" class="flex items-center gap-2.5 overflow-x-auto pb-2"></div>
            </div>

            <!-- Lista -->
            <div id="task-list" class="space-y-4"></div>

            <!-- Estado Vazio -->
            <div id="empty-state" class="hidden text-center py-16">
                <div class="w-20 h-20 bg-slate-900/90 border border-slate-800/80 rounded-3xl flex items-center justify-center mx-auto text-slate-600 text-2xl mb-4 shadow-inner">
                    <i class="fa-regular fa-clipboard"></i>
                </div>
                <p class="text-slate-400 text-base font-medium">Nenhuma tarefa encontrada.</p>
            </div>
        </main>
    </div>

    <!-- SCRIPT DE INTEGRAÇÃO COM SUPABASE -->
    <script>
        const SUPABASE_URL = 'https://cacdgtvthdidnbwygqsj.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNhY2RndHZ0aGRpZG5id3lncXNqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk3NjY4ODgsImV4cCI6MjEwNTM0Mjg4OH0.vQKq2oX8YFwgRTvEq871Gqu9qPi3iT28YV-lUbRyxVA';

        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let tasks = [];
        let currentStatusFilter = 'all';
        let currentCategoryFilter = 'all';
        let isSignUpMode = false;
        let currentUser = null;

        const authScreen = document.getElementById('auth-screen');
        const appScreen = document.getElementById('app-screen');
        const authForm = document.getElementById('auth-form');
        const authEmail = document.getElementById('auth-email');
        const authPassword = document.getElementById('auth-password');
        const authBtn = document.getElementById('auth-btn');
        const authError = document.getElementById('auth-error');
        const authSubtitle = document.getElementById('auth-subtitle');
        const authToggleBtn = document.getElementById('auth-toggle-btn');
        const userEmailDisplay = document.getElementById('user-email-display');

        const taskForm = document.getElementById('task-form');
        const taskInput = document.getElementById('task-input');
        const taskCategory = document.getElementById('task-category');
        const taskPriority = document.getElementById('task-priority');
        const taskId = document.getElementById('task-id');
        const submitBtn = document.getElementById('submit-btn');
        const cancelEditBtn = document.getElementById('cancel-edit');
        const taskList = document.getElementById('task-list');
        const emptyState = document.getElementById('empty-state');
        const categorySuggestions = document.getElementById('category-suggestions');
        const categoryFilters = document.getElementById('category-filters');
        
        const statTotal = document.getElementById('stat-total');
        const statPending = document.getElementById('stat-pending');
        const statCompleted = document.getElementById('stat-completed');

        async function checkSession() {
            const { data: { session } } = await supabaseClient.auth.getSession();
            if (session) {
                currentUser = session.user;
                showApp();
            } else {
                showAuth();
            }
        }

        function showAuth() {
            authScreen.style.display = 'flex';
            appScreen.style.display = 'none';
        }

        function showApp() {
            authScreen.style.display = 'none';
            appScreen.style.display = 'flex';
            userEmailDisplay.textContent = `Logado como: ${currentUser.email}`;
            fetchTasks();
        }

        function toggleAuthMode() {
            isSignUpMode = !isSignUpMode;
            if (isSignUpMode) {
                authSubtitle.textContent = "Crie uma nova conta para salvar suas tarefas";
                authBtn.textContent = "Cadastrar";
                authToggleBtn.textContent = "Já tem uma conta? Faça login";
            } else {
                authSubtitle.textContent = "Entre com sua conta para acessar suas tarefas";
                authBtn.textContent = "Entrar";
                authToggleBtn.textContent = "Não tem uma conta? Crie uma agora";
            }
            authError.classList.add('hidden');
        }

        authForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            authError.classList.add('hidden');
            const email = authEmail.value;
            const password = authPassword.value;

            if (isSignUpMode) {
                const { data, error } = await supabaseClient.auth.signUp({ email, password });
                if (error) {
                    authError.textContent = error.message;
                    authError.classList.remove('hidden');
                } else {
                    alert('Cadastro realizado com sucesso! Faça login.');
                    toggleAuthMode();
                }
            } else {
                const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });
                if (error) {
                    authError.textContent = "E-mail ou senha incorretos.";
                    authError.classList.remove('hidden');
                } else {
                    currentUser = data.user;
                    showApp();
                }
            }
        });

        async function logout() {
            await supabaseClient.auth.signOut();
            currentUser = null;
            tasks = [];
            showAuth();
        }

        async function fetchTasks() {
            const { data, error } = await supabaseClient
                .from('tasks')
                .select('*')
                .order('id', { ascending: false });

            if (error) {
                console.error('Erro ao buscar tarefas:', error);
            } else {
                tasks = data || [];
                render();
            }
        }

        taskForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const text = taskInput.value.trim();
            const category = taskCategory.value.trim() || 'Geral';
            const priority = taskPriority.value;
            const id = taskId.value;

            if (!text) return;

            if (id) {
                const { error } = await supabaseClient
                    .from('tasks')
                    .update({ text, category, priority })
                    .eq('id', id);

                if (!error) resetForm();
            } else {
                const { error } = await supabaseClient
                    .from('tasks')
                    .insert([{ 
                        text, 
                        category, 
                        priority, 
                        completed: false, 
                        user_id: currentUser.id 
                    }]);

                if (!error) {
                    taskInput.value = '';
                    taskCategory.value = '';
                }
            }
            fetchTasks();
        });

        function render() {
            updateCategoryUI();

            let filteredTasks = tasks.filter(t => {
                const matchesStatus = 
                    currentStatusFilter === 'all' ? true :
                    currentStatusFilter === 'pending' ? !t.completed : t.completed;
                
                const matchesCategory = 
                    currentCategoryFilter === 'all' ? true : t.category.toLowerCase() === currentCategoryFilter.toLowerCase();

                return matchesStatus && matchesCategory;
            });

            statTotal.textContent = tasks.length;
            const completedCount = tasks.filter(t => t.completed).length;
            statCompleted.textContent = completedCount;
            statPending.textContent = tasks.length - completedCount;

            taskList.innerHTML = '';
            if (filteredTasks.length === 0) {
                emptyState.classList.remove('hidden');
            } else {
                emptyState.classList.add('hidden');
                
                filteredTasks.forEach(task => {
                    const priorityStyles = {
                        baixa: 'bg-blue-500/15 text-blue-400 border-blue-500/30 shadow-sm shadow-blue-500/5',
                        media: 'bg-amber-500/15 text-amber-400 border-amber-500/30 shadow-sm shadow-amber-500/5',
                        alta: 'bg-red-500/15 text-red-400 border-red-500/30 shadow-sm shadow-red-500/5'
                    };

                    const taskEl = document.createElement('div');
                    taskEl.className = `group bg-slate-900/90 border ${task.completed ? 'border-slate-900 opacity-60' : 'border-slate-800/80'} rounded-2xl p-5 flex items-center justify-between gap-4 transition-all hover:border-slate-700 shadow-md backdrop-blur-md`;
                    
                    taskEl.innerHTML = `
                        <div class="flex items-center gap-4 min-w-0 flex-grow">
                            <input type="checkbox" ${task.completed ? 'checked' : ''} onclick="toggleTask(${task.id}, ${task.completed})"
                                class="w-6 h-6 rounded-lg accent-violet-600 bg-slate-950 border-slate-800 cursor-pointer">
                            <div class="min-w-0">
                                <span class="text-base block truncate font-medium ${task.completed ? 'line-through text-slate-500' : 'text-slate-100'}">${escapeHtml(task.text)}</span>
                                <span class="inline-flex items-center gap-1.5 text-xs text-violet-400 bg-violet-500/10 border border-violet-500/20 px-2.5 py-0.5 rounded-md mt-1.5 font-semibold"><i class="fa-solid fa-tag"></i>${escapeHtml(task.category)}</span>
                            </div>
                        </div>
                        <div class="flex items-center gap-4 shrink-0">
                            <span class="text-xs px-3.5 py-1.5 rounded-full border uppercase font-bold tracking-wider ${priorityStyles[task.priority]}">${task.priority}</span>
                            <div class="opacity-0 group-hover:opacity-100 transition-opacity flex items-center gap-1.5">
                                <button onclick="editTask(${task.id})" class="text-slate-400 hover:text-slate-200 p-2 rounded-xl hover:bg-slate-800 transition-colors" title="Editar">
                                    <i class="fa-solid fa-pen text-sm"></i>
                                </button>
                                <button onclick="deleteTask(${task.id})" class="text-red-400 hover:text-red-300 p-2 rounded-xl hover:bg-slate-800 transition-colors" title="Excluir">
                                    <i class="fa-solid fa-trash text-sm"></i>
                                </button>
                            </div>
                        </div>
                    `;
                    taskList.appendChild(taskEl);
                });
            }
        }

        function updateCategoryUI() {
            // Extrai categorias únicas de forma segura
            const categories = [...new Set(tasks.map(t => t.category ? t.category.trim() : ''))].filter(Boolean);
            categorySuggestions.innerHTML = categories.map(cat => `<option value="${cat}">`).join('');

            let catButtonsHtml = `
                <button onclick="setCategoryFilter('all')" class="px-4 py-2 rounded-xl text-xs font-semibold whitespace-nowrap transition-all ${currentCategoryFilter === 'all' ? 'bg-indigo-600 text-white shadow-md' : 'bg-slate-900 border border-slate-800 text-slate-400 hover:text-slate-200'}">
                    Todas Categorias
                </button>
            `;
            
            categories.forEach(cat => {
                const isActive = currentCategoryFilter.toLowerCase() === cat.toLowerCase();
                catButtonsHtml += `
                    <button onclick="setCategoryFilter('${cat}')" class="px-4 py-2 rounded-xl text-xs font-semibold whitespace-nowrap transition-all ${isActive ? 'bg-indigo-600 text-white shadow-md' : 'bg-slate-900 border border-slate-800 text-slate-400 hover:text-slate-200'}">
                        ${escapeHtml(cat)}
                    </button>
                `;
            });
            categoryFilters.innerHTML = catButtonsHtml;
        }

        async function toggleTask(id, currentStatus) {
            await supabaseClient
                .from('tasks')
                .update({ completed: !currentStatus })
                .eq('id', id);
            fetchTasks();
        }

        async function deleteTask(id) {
            await supabaseClient.from('tasks').delete().eq('id', id);
            fetchTasks();
        }

        async function clearAllCompleted() {
            if (confirm('Deseja apagar todas as tarefas concluídas?')) {
                await supabaseClient.from('tasks').delete().eq('completed', true).eq('user_id', currentUser.id);
                fetchTasks();
            }
        }

        function editTask(id) {
            const task = tasks.find(t => t.id === id);
            if (task) {
                taskInput.value = task.text;
                taskCategory.value = task.category;
                taskPriority.value = task.priority;
                taskId.value = task.id;
                submitBtn.innerHTML = `<i class="fa-solid fa-check"></i> Salvar Edição`;
                cancelEditBtn.classList.remove('hidden');
                taskInput.focus();
            }
        }

        cancelEditBtn.addEventListener('click', resetForm);

        function resetForm() {
            taskInput.value = '';
            taskCategory.value = '';
            taskPriority.value = 'media';
            taskId.value = '';
            submitBtn.innerHTML = `<i class="fa-solid fa-plus"></i> Adicionar Tarefa`;
            cancelEditBtn.classList.add('hidden');
        }

        function setStatusFilter(filter) {
            currentStatusFilter = filter;
            ['all', 'pending', 'completed'].forEach(f => {
                const btn = document.getElementById(`filter-${f}`);
                if (f === filter) {
                    btn.className = "px-5 py-2.5 rounded-xl text-xs font-bold bg-violet-600 text-white transition-all shadow";
                } else {
                    btn.className = "px-5 py-2.5 rounded-xl text-xs font-semibold text-slate-400 hover:text-slate-200 transition-all";
                }
            });
            render();
        }

        function setCategoryFilter(cat) {
            currentCategoryFilter = cat;
            render();
        }

        function escapeHtml(text) {
            return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
        }

        checkSession();
    </script>
</body>
</html>
